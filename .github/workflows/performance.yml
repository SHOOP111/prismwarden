name: Synthetic performance

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional trusted commit or branch to measure with the same harness
        required: false
        type: string

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: performance
      - name: Record runner and toolchain
        run: |
          mkdir -p .prismwarden/performance
          uname -a > .prismwarden/performance/environment.txt
          lscpu >> .prismwarden/performance/environment.txt
          rustc --version >> .prismwarden/performance/environment.txt
          git rev-parse HEAD >> .prismwarden/performance/environment.txt
      - name: Measure five generated corpora with warm-ups and repeated rotated samples
        run: cargo run --locked --release --example throughput > .prismwarden/performance/measurements.json
      - name: Check out optional baseline
        if: inputs.baseline_ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.baseline_ref }}
          path: .prismwarden/baseline
      - name: Copy identical benchmark harness and record baseline identity
        if: inputs.baseline_ref != ''
        run: |
          cp examples/throughput.rs .prismwarden/baseline/examples/throughput.rs
          git -C .prismwarden/baseline rev-parse HEAD > .prismwarden/performance/baseline-commit.txt
      - name: Measure optional baseline on the same runner
        if: inputs.baseline_ref != ''
        working-directory: .prismwarden/baseline
        run: cargo run --locked --release --example throughput > ../performance/baseline-measurements.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-performance
          path: .prismwarden/performance/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
