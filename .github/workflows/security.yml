name: Security audit

on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, .github/workflows/security.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, .github/workflows/security.yml]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: security-tools
      - name: Install pinned audit tool on the runner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies against RustSec
        run: cargo audit --deny warnings
