[package]
name = "prismwarden"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline, privacy-conscious OPSEC auditing for source trees"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SHOOP111/prismwarden"
readme = "README.md"
keywords = ["security", "opsec", "secrets", "sarif", "audit"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
